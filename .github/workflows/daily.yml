name: 日次（株価更新・シグナル）

on:
  schedule:
    - cron: "45 7 * * 1-5"   # 平日 16:45 JST（大引け後）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kabu-write
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 株価更新 → ルールの健康診断 → シグナル生成
        run: python -m kabu daily --force
      - name: 結果をコミット
        run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add RULES.md SIGNALS.md docs rules trades data/universe.csv
          git diff --cached --quiet || git commit -m "日次更新: シグナルとルールの健康診断"
          git pull --rebase --autostash
          git push
