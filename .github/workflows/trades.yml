name: 実トレード取り込み

on:
  push:
    paths:
      - "trades/inbox/**"
      - "trades/manual.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kabu-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 株価を取得（ルールとの照合に使う）
        run: python -m kabu update-data --force
      - name: 取引履歴を取り込み、分析
        run: python -m kabu import-trades
      - name: 結果をコミット
        run: |
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add RULES.md SIGNALS.md docs rules trades
          git diff --cached --quiet || git commit -m "実トレード分析を更新"
          git pull --rebase --autostash
          git push
