# ============================================================
# kabu 設定ファイル
#   ここの数値を変えると、バックテスト・ルール・発注数量すべてに反映されます。
# ============================================================

account:
  capital: 3000000          # 運用資金（円）
  monthly_target: 200000    # 月間の目標利益（円）
  max_leverage: 2.0         # 建玉合計 ÷ 運用資金 の上限（信用の法定上限は約3.3倍。追証を避けるため低めに設定）
  lot_size: 100             # 単元株数

costs:
  # 楽天証券「ゼロコース」前提（国内株の売買手数料 0円）
  commission_bps: 0.0       # 片道の手数料（bps = 0.01%）
  slippage_bps: 10.0        # 片道のスリッページ想定（成行・逆指値の滑り）。実トレード分析の結果で自動的に引き上げられる
  long_interest_annual: 0.028   # 信用買いの金利（制度信用 年2.80%）
  short_fee_annual: 0.011       # 空売りの貸株料（年1.10%）
  short_extra_annual: 0.010     # 逆日歩などの余裕分（年率換算の保守的な上乗せ）

universe:
  # JPX公表の規模区分。TOPIX500 + Small1 を母集団にし、売買代金で日々絞り込む
  segments: ["TOPIX Core30", "TOPIX Large70", "TOPIX Mid400", "TOPIX Small 1"]
  short_segments: ["TOPIX Core30", "TOPIX Large70", "TOPIX Mid400"]  # 空売り対象（貸借銘柄である可能性が高い大型〜中型）
  min_turnover: 500000000   # 直近20日の売買代金中央値がこの額以上（5億円）の銘柄だけ売買する
  min_price: 200            # 低位株は除外（円）
  index_symbol: "^N225"     # 相場環境の判定に使う指数
  index_name: "日経平均"

data:
  start: "2012-01-01"       # 取得開始日（指標の助走期間を含む）
  backtest_start: "2014-01-01"

validation:
  # ---- データの分け方 ----
  oos_start: "2022-01-01"   # これ以降は「未使用データ」。パラメータ選びには一切使わず、合否判定だけに使う
  wf_train_years: 4         # ウォークフォワード: 学習期間（年）
  wf_test_years: 1          # ウォークフォワード: 検証期間（年）
  # ---- 採用基準（すべて満たしたルールだけが「採用」になる）----
  min_trades_oos: 80            # 未使用データ期間での取引回数
  min_profit_factor_oos: 1.25   # 未使用データ期間のプロフィットファクター（総利益÷総損失）
  min_profit_factor_wf: 1.15    # ウォークフォワード通算のプロフィットファクター
  min_positive_months: 0.55     # 月次でプラスだった月の割合
  max_drawdown_years: 2.0       # 最大ドローダウンが「平均年間利益の何年分」まで許すか（取り返すのに 2 年超かかるルールは不採用）
  min_neighbor_pass: 0.6        # 近傍パラメータのうち黒字だった割合（たまたま当たった1点を除外する）
  min_tstat: 2.0                # 月次損益の t値（偶然では説明しにくい水準）
  # ---- 入れ替え基準 ----
  replace_margin: 0.10          # 新ルールが現行ルールより 10% 以上良い場合のみ入れ替える
  # ---- 停止基準（採用中ルールの健康診断）----
  suspend_recent_months: 6      # 直近 N か月の成績で判定
  suspend_profit_factor: 0.9    # 直近の PF がこれを下回ったら停止
  suspend_dd_multiple: 1.5      # 直近のドローダウンが過去最大の何倍を超えたら停止

portfolio:
  # 採用ルールをまとめて運用するときの建玉サイズの決め方:
  # 過去検証での最大ドローダウンが下の上限に収まる範囲で、最も大きい倍率を選ぶ
  max_drawdown_pct: 0.20        # 許容する最大ドローダウン（運用資金比）
  scales: [2.0, 1.5, 1.25, 1.0, 0.85, 0.75, 0.6, 0.5, 0.4, 0.3, 0.25]   # 1 ルールあたりの建玉枠（資金の何倍）の候補

site:
  include_real_trades: true     # 公開サイトに実トレードの損益を載せるか（公開リポジトリ/Pagesにする場合は false 推奨）
